    <!-- Custom CSS for Animations & Aurora Background -->
    <style>
        body {
            background-color: #0a0d1e;
        }

        .reveal-item {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .reveal-item.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 幻想的なオーロラ背景アニメーション */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            /* 背景を少し明るい薄紫系に変更 */
            background: linear-gradient(135deg, #18112e 0%, #2b1d4a 40%, #221840 70%, #11142b 100%);
        }

        .aurora-blob-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(138, 90, 219, 0.35) 0%, transparent 65%);
            filter: blur(60px);
            animation: float-1 15s infinite ease-in-out alternate;
        }

        .aurora-blob-2 {
            position: absolute;
            bottom: -10%;
            right: -20%;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(90, 195, 219, 0.3) 0%, transparent 60%);
            filter: blur(60px);
            animation: float-2 20s infinite ease-in-out alternate-reverse;
        }

        .aurora-blob-3 {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(219, 90, 165, 0.25) 0%, transparent 60%);
            filter: blur(60px);
            animation: float-3 18s infinite ease-in-out alternate;
        }

        @keyframes float-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }
        @keyframes float-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -10%) scale(1.05); }
        }
        @keyframes float-3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-40%, -60%) scale(1.2); }
        }

        /* 星の瞬き */
        .bg-stars {
            background-image: 
                radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 60px 80px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 120px 150px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 40px, rgba(255,255,255,0.3), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.5;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        /* シャインのような輝きを放つ三日月 */
        .crescent-moon {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px; /* 輝き(グロー)が切れないように大きめに確保 */
            height: 300px;
            z-index: 1;
            pointer-events: none;
            animation: moon-pulse 6s ease-in-out infinite alternate;
        }

        @keyframes moon-pulse {
            0% { opacity: 0.8; transform: translateX(-50%) scale(0.95); filter: brightness(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); filter: brightness(1.2); }
        }
    </style>
</head>
<body class="text-white min-h-screen relative font-mincho antialiased selection:bg-white/30 selection:text-white">

    </main>

    <!-- アニメーション用スクリプト -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const revealItems = document.querySelectorAll('.reveal-item');
            
            // よりゆったりとした優雅な出現アニメーション
            revealItems.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('is-visible');
                }, 180 * index + 100);
            });
        });
    </script>
